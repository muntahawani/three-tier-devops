<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>3-Tier Web Application</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: #38bdf8;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 1.5rem;
      background: #22c55e;
      color: #022c22;
    }

    .tier-box {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.9rem;
      text-align: left;
    }

    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>3-Tier DevOps Dashboard</h1>
    <div id="health" class="status-badge">Checking API...</div>

    <div class="tier-box">
      <strong>Tier 1 (Database):</strong> <span id="db-status">Loading...</span>
    </div>
    <div class="tier-box">
      <strong>Tier 2 (API Views):</strong> <span id="db-counter">Loading...</span>
    </div>
    <div class="tier-box">
      <strong>Tier 3 (Frontend):</strong> Nginx Live
    </div>

    <button class="btn" onclick="fetchData()">Refresh State</button>
  </div>

  <script>
    async function fetchData() {
      try {
        const res = await fetch('http://' + window.location.hostname + ':5001/api/data');
        const data = await res.json();
        document.getElementById('health').innerText = "System Online";
        document.getElementById('health').style.background = "#22c55e";
        document.getElementById('db-status').innerText = data.database_status;
        document.getElementById('db-counter').innerText = data.views_counter;
      } catch (err) {
        document.getElementById('health').innerText = "Backend Unreachable";
        document.getElementById('health').style.background = "#ef4444";
        document.getElementById('db-status').innerText = "Disconnected";
        document.getElementById('db-counter').innerText = "N/A";
      }
    }
    fetchData();
  </script>
</body>

</html>
